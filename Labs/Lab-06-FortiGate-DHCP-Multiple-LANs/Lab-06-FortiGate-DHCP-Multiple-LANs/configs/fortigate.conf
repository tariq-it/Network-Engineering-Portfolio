# Lab 06 - FortiGate DHCP + Multiple LANs
# Reconstructed from the verified lab configuration and observed state.

config system interface
    edit "port1"
        set ip 192.168.233.130 255.255.255.0
        set allowaccess ping https ssh http
    next
    edit "port2"
        set alias "OFFICE-LAN"
        set ip 192.168.10.1 255.255.255.0
        set allowaccess ping https ssh
    next
    edit "port3"
        set alias "STAFF-LAN"
        set ip 192.168.20.1 255.255.255.0
        set allowaccess ping https ssh
    next
end

config router static
    edit 1
        set gateway 192.168.233.2
        set device "port1"
    next
end

# DHCP server IDs can vary by appliance/configuration.
config system dhcp server
    edit 1
        set interface "port2"
        set netmask 255.255.255.0
        set default-gateway 192.168.10.1
        config ip-range
            edit 1
                set start-ip 192.168.10.10
                set end-ip 192.168.10.100
            next
        end
    next
    edit 2
        set interface "port3"
        set netmask 255.255.255.0
        set default-gateway 192.168.20.1
        config ip-range
            edit 1
                set start-ip 192.168.20.10
                set end-ip 192.168.20.100
            next
        end
    next
end

config firewall policy
    edit 1
        set name "STAFF-to-OFFICE"
        set srcintf "port3"
        set dstintf "port2"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
        # NAT is intentionally disabled for inter-LAN routing.
        set auto-asic-offload disable
    next
end

# NOTE:
# auto-asic-offload was disabled temporarily during troubleshooting.
# Inter-LAN ICMP forwarding remained unresolved in this EVE-NG run.
