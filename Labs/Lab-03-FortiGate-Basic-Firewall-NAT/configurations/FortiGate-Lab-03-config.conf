# Lab-03 - FortiGate Basic Firewall and SNAT
# FortiOS 7.2.0 / EVE-NG
# Management access on port1 is enabled only for this isolated lab.

config system interface
    edit "port1"
        set mode dhcp
        set allowaccess ping https ssh http
    next
    edit "port2"
        set ip 192.168.10.1 255.255.255.0
        set allowaccess ping https ssh http
        set role lan
    next
end

config firewall policy
    edit 1
        set name "LAN-to-Internet"
        set srcintf "port2"
        set dstintf "port1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set ssl-ssh-profile "no-inspection"
        set logtraffic all
        set nat enable
    next
end

config log memory setting
    set status enable
end
